# Publish the static site in site/ to GitHub Pages.
#
# The site is plain HTML/CSS/JS with no build step, so there is nothing to
# compile — the artifact is site/ uploaded verbatim. It hosts no ZK prover keys:
# issueCertificate writes the verdict band to the ledger, so the tenant page is
# a read, not a proof.
name: Deploy site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # Refresh the certificate snapshot from the live ledger so /check is
      # current at deploy time. Decoding ledger state needs the compiled
      # contract, hence the toolchain here — none of it is published; only the
      # resulting JSON is.
      #
      # Deliberately non-fatal: if the indexer is unreachable, ship the
      # committed snapshot rather than fail the deploy. The page prints the
      # block and timestamp it was taken at, so a stale one is visible as stale
      # rather than passed off as current.
      - name: Refresh the ledger snapshot
        id: snapshot
        continue-on-error: true
        run: |
          npm ci
          curl --proto '=https' --tlsv1.2 -LsSf             https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          npm run compile
          npm run snapshot

      # The Full Demo proves in the browser, so it needs the Vite bundle and
      # ~11 MB of prover keys. Both are build output and neither is committed —
      # "we clone your GitHub repository" is step one of the judging, and
      # nobody should wait on build artifacts to do it.
      #
      # Non-fatal on purpose, like the snapshot above: if this breaks, every
      # other page still deploys and demo.html reports that it could not start,
      # which is better than losing the whole site over one page.
      - name: Build the Full Demo bundle
        id: demo
        continue-on-error: true
        run: |
          npm ci
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.compact/bin:$PATH"
          compact update 0.31.1
          npm run compile
          npm run build:demo

      - name: Report demo build outcome
        run: |
          if [ "${{ steps.demo.outcome }}" = "success" ]; then
            echo "Demo bundle built; site/zk and site/assets/demo staged."
            du -sh site/zk site/assets/demo site/params || true
          else
            echo "::warning::Demo build failed; demo.html will report it cannot start."
          fi

      - name: Report snapshot outcome
        run: |
          if [ "${{ steps.snapshot.outcome }}" = "success" ]; then
            echo "Snapshot refreshed from the live ledger."
          else
            echo "::warning::Snapshot refresh failed; deploying the committed snapshot."
          fi
          node -e "const s=require('./site/data/certificates.json');console.log('block',s.block,'taken',s.takenAt)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
